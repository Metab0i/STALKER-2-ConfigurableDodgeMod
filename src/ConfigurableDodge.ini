; ============================================================================
; Configurable Dodge Mod (native) - configuration
; Edit and save while in game: changes apply within ~2 seconds, no restart.
; ============================================================================
;
; BINDABLE KEYS (ButtonKey and the DoubleTap keys)
; Use the exact engine key name below, a VK hex code (e.g. 0x58), or a mouse
; button name. Names are case-sensitive.
;
;   letters ........ A B C ... Z
;   digits ......... 0 1 ... 9            (or Zero One ... Nine)
;   function keys .. F1 F2 ... F12        (F13-F24 do not exist in the engine)
;   arrows ......... Left Up Right Down
;   edit keys ...... Home End PageUp PageDown Insert Delete BackSpace
;   misc ........... Tab Enter Escape SpaceBar Pause CapsLock NumLock ScrollLock
;   modifiers ...... LeftShift RightShift LeftControl RightControl
;                    LeftAlt RightAlt (Windows keys are not supported)
;   symbols ........ Semicolon Equals Comma Hyphen Period Slash Tilde
;                    LeftBracket Backslash RightBracket Apostrophe
;   numpad ......... NumPadZero ... NumPadNine  Multiply Add Subtract
;                    Decimal Divide
;   mouse .......... LeftMouseButton RightMouseButton MiddleMouseButton
;                    ThumbMouseButton (Mouse 4)  ThumbMouseButton2 (Mouse 5)
;
; Aliases also accepted: "Left Alt", "Right Alt", "Left Ctrl", "Right Ctrl",
; "Left Shift", "Right Shift", "Space", "Backspace", and ; = , - . / ` [ \ ] '
;

[Config]
; How you dodge:
;   button    = hold a movement key (A/D/S) and press ButtonKey
;   doubletap = double-tap the DoubleTap keys
Modality=button

; --- Button modality ---
; Key pressed (while holding a movement key) to dodge. Modifiers work.
ButtonKey=Left Alt

; --- Double-tap modality ---
; Keys double-tapped to dodge left / right / back.
DoubleTapLeft=Z
DoubleTapRight=C
DoubleTapBack=S
; Max seconds between the two taps (try 0.12-0.20).
DoubleTapWindow=0.155

; --- Dodge forces (cm/s) ---
; Side dodge: horizontal push + upward push. Back dodge: same idea.
; Higher = snappier/farther. Lower these if the dodge feels too strong.
SideHorizontal=650
SideVertical=500
BackHorizontal=900
BackVertical=200

; Stamina spent per dodge (0 = free dodges).
StaminaCost=15
; Refuse a dodge below StaminaCost instead of going negative. 1 = on, 0 = off.
RequireStamina=1
; Minimum seconds between two dodges.
Cooldown=0.6

; --- Energy drink interaction ---
; The game briefly stops stamina drain after drinking an energy drink; while
; that window is active a dodge costs no stamina. 1 = on, 0 = off.
EnergyDrinkEffect=1
; Length of that free-dodge window in seconds.
EnergyDrinkFreeSeconds=4.5
; Overuse-value rise that counts as drinking (advanced; leave at 50).
EnergyDrinkOveruseJump=50

; --- Diagonstics ---
; Refuse dodges while a menu or dialog has the mouse cursor up. 1 = on, 0 = off.
RequireCursorFree=1
; Write ConfigurableDodge.log next to this file. 1 = on, 0 = off.
Log=1
