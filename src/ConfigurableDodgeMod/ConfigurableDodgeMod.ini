; Configurable Dodge Mod - configuration (generated by Setup.ps1)
; Edit by hand anytime - changes apply within ~2 seconds in game.

[Config]
; "button" = hold a movement key, press the dodge button
; "doubletap" = double-tap the dodge keys
Modality=button

; --- Button modality ---
; Any key name, VK hex (0xA4) or mouse button - modifiers work too.
; A trailing "; name" comment is ignored (Setup writes it for readability).
ButtonKey=Left Alt

; --- Double-tap modality ---
DoubleTapLeft=Z
DoubleTapRight=C
DoubleTapBack=S
DoubleTapWindow=0.155

; --- Directional and vertical forces (cm/s) and stamina cost (vanilla jump = 20) ---
SideHorizontal=650
SideVertical=500
BackHorizontal=900
BackVertical=200
StaminaCost=15


; --- Energy drink interaction ---
; Vanilla energy drinks stop stamina drain briefly after drinking; during that
; window a dodge costs no stamina. Set EnergyDrinkEffect=0 to ignore the buff.
EnergyDrinkEffect=1
EnergyDrinkFreeSeconds=4.5
; overuse-value jump that counts as drinking an energy drink (advanced)
EnergyDrinkOveruseJump=50
