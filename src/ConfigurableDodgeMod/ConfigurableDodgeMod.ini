; Configurable Dodge Mod - configuration
;
; Edit values below and save - changes apply within ~2 seconds while the
; game is running (no restart needed). Run Setup.bat for an interactive
; setup instead, if you prefer being prompted.
;
; Only ONE modality can be active: "button" or "doubletap".
; "button"    = hold a movement key, press the dodge button
; "doubletap" = double-tap the dodge keys
Modality=button

; The dodge button. Hold a movement key (A/D/S or your bindings) and press
; this to dodge in that direction. Standing still or moving straight
; forward does nothing.
;
; Accepts key names (Left Alt, Space, F5, ThumbMouseButton) or Virtual-Key
; codes in hex:
;   0x58=X  0x5A=Z  0x43=C  0x53=S  letters 0x41-0x5A  digits 0x30-0x39
;   0x01=LeftMouse  0x02=RightMouse  0x04=MiddleMouse
;   0x05=Mouse4     0x06=Mouse5      0x20=Space  0x14=CapsLock
;   F-keys: 0x70=F1 ... 0x7B=F12   arrows: 0x25-0x28
;   Modifiers: 0xA4=Left Alt 0xA5=Right Alt 0xA0=Left Shift 0xA2=Left Ctrl
; Modifier keys are fully supported - the mod's listener reads them at the
; OS level (the engine's own input hook never sees them).
ButtonKey=Left Alt

; Double-tap these keys to dodge left / right / back (doubletap modality)
DoubleTapLeft=Z
DoubleTapRight=C
DoubleTapBack=S

; Seconds allowed between the two taps (doubletap modality)
DoubleTapWindow=0.25

; Forces (cm/s) and stamina cost (vanilla jump = 20)
SideHorizontal=650
SideVertical=500
BackHorizontal=900
BackVertical=200
StaminaCost=20
